[project]
name = "incidentops-ai"
version = "0.1.0"
description = "Multi-Agent Autonomous Incident Triage Engine (IncidentOps AI) powered by LangGraph, Claude 3.5 Sonnet, and Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ashutosh Somvanshi", email = "ashutosh.somvanshi@nihilent.com" }
]
keywords = [
    "langgraph",
    "mcp",
    "incident-response",
    "sre",
    "multi-agent",
    "claude-3-5-sonnet",
    "autonomous-triage",
    "devops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.25.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "streamlit>=1.35.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
incidentops = "incidentops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
