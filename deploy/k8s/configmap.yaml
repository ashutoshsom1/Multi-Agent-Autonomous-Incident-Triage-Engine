apiVersion: v1
kind: ConfigMap
metadata:
  name: incidentops-config
  namespace: incidentops
data:
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  PRIMARY_MODEL: "claude-3-5-sonnet-20241022"
  MAX_ITERATION_GUARD: "3"
  ENABLE_POSTGRES_CHECKPOINTER: "true"
  POSTGRES_DB_URI: "postgresql://incidentops:secretpassword@postgres-rw.internal:5432/incidentops_checkpoints"
  PROMETHEUS_URL: "http://prometheus-k8s.monitoring.svc:9090"
  LOKI_URL: "http://loki-gateway.logging.svc:3100"
  ELASTICSEARCH_URL: "http://elasticsearch-es-http.logging.svc:9200"
  K8S_NAMESPACE_DEFAULT: "production"
  USE_MOCK_MCP: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: incidentops-secrets
  namespace: incidentops
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-prod-replace-with-vault-secret"
  SLACK_SIGNING_SECRET: "replace-with-production-slack-signing-secret"
  SLACK_BOT_TOKEN: "xoxb-replace-with-production-bot-token"
  GITHUB_TOKEN: "ghp_replace-with-production-github-pat"
  INCIDENTOPS_API_KEY: "prod-bearer-token-key-for-alertmanager"
