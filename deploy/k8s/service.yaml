apiVersion: v1
kind: Service
metadata:
  name: incidentops-engine
  namespace: incidentops
  labels:
    app.kubernetes.io/name: incidentops-engine
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: incidentops-engine
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: incidentops-pdb
  namespace: incidentops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incidentops-engine
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incidentops-hpa
  namespace: incidentops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: incidentops-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
